[theme]
# Warna utama untuk tombol, slider, dan elemen aktif
primaryColor = "#27ae60"

# Warna background halaman utama
backgroundColor = "#6126AD"

# Warna background sidebar dan kotak input
secondaryBackgroundColor = "#f1f8f4"

# Warna teks utama
textColor = "#2c3e50"

# Pilihan font: "sans serif", "serif", atau "monospace"
font = "sans serif"
